name: Build Pizza Stack (Android APK/AAB + Windows/macOS/Linux)

on:
  push:
    branches: [main, 'claude/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to attach files to a GitHub Release on tags

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - run: node --check www/js/game.js && node --check www/js/ui.js

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Prepare Android SDK (preinstalled on the runner)
        run: |
          SDKM="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0" || true
      - run: npm ci
      - run: npx cap sync android

      # Always produce an installable debug APK (signed with the debug key) for quick testing / sideloading.
      - name: Build debug APK
        working-directory: android
        env: { VERSION_CODE: '${{ github.run_number }}' }
        run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: PizzaStack-android-debug-apk, path: android/app/build/outputs/apk/debug/*.apk }

      # Signed release APK + AAB (Play Store). Requires the 4 repository secrets listed in README.md.
      - name: Check for signing secrets
        id: sign
        env: { KS: '${{ secrets.ANDROID_KEYSTORE_BASE64 }}' }
        run: echo "have=$([ -n "$KS" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Build signed release APK + AAB
        if: steps.sign.outputs.have == 'true'
        working-directory: android
        env:
          VERSION_CODE: '${{ github.run_number }}'
          VERSION_NAME: '1.0.${{ github.run_number }}'
          ANDROID_KEYSTORE_PASSWORD: '${{ secrets.ANDROID_KEYSTORE_PASSWORD }}'
          ANDROID_KEY_ALIAS: '${{ secrets.ANDROID_KEY_ALIAS }}'
          ANDROID_KEY_PASSWORD: '${{ secrets.ANDROID_KEY_PASSWORD }}'
          KS_B64: '${{ secrets.ANDROID_KEYSTORE_BASE64 }}'
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/release.keystore"
          ./gradlew --no-daemon assembleRelease bundleRelease
      - if: steps.sign.outputs.have == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: PizzaStack-android-release
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab

      # No signing secrets yet? Prove the release pipeline (APK + AAB) still builds, using a THROWAWAY key.
      # These files are NOT official: they cannot be published or updated. Add the 4 secrets (README) for the real thing.
      - name: Release build check with a throwaway key (not for stores)
        if: steps.sign.outputs.have != 'true'
        working-directory: android
        env:
          VERSION_CODE: '${{ github.run_number }}'
          ANDROID_KEYSTORE_PASSWORD: throwaway
          ANDROID_KEY_ALIAS: throwaway
          ANDROID_KEY_PASSWORD: throwaway
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/throwaway.keystore" -alias throwaway -keyalg RSA -keysize 2048 -validity 30 \
            -storepass throwaway -keypass throwaway -dname "CN=Pizza Stack throwaway test key"
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/throwaway.keystore"
          ./gradlew --no-daemon assembleRelease bundleRelease
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/*.apk | head -5
          ls -la app/build/outputs/apk/release app/build/outputs/bundle/release
      - if: steps.sign.outputs.have != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: PizzaStack-android-release-THROWAWAY-KEY-NOT-FOR-STORES
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab

  desktop:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, script: 'dist:win',   name: windows }
          - { os: ubuntu-latest,  script: 'dist:linux', name: linux }
          - { os: macos-latest,   script: 'dist:mac',   name: macos }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'   # unsigned unless you add code-signing certs (see README)
      - uses: actions/upload-artifact@v4
        with:
          name: PizzaStack-${{ matrix.name }}
          path: |
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/*.dmg

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
