name: Build Pizza Stack (Android APK/AAB + iOS IPA + Windows/macOS/Linux)

on:
  push:
    branches: [main, 'claude/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to attach files to a GitHub Release on tags

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - run: node --check www/js/game.js && node --check www/js/ui.js

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Prepare Android SDK (preinstalled on the runner)
        run: |
          SDKM="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0" || true
      - run: npm ci
      - run: npx cap sync android

      # Always produce an installable debug APK (signed with the debug key) for quick testing / sideloading.
      - name: Build debug APK
        working-directory: android
        env: { VERSION_CODE: '${{ github.run_number }}' }
        run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: PizzaStack-android-debug-apk, path: android/app/build/outputs/apk/debug/*.apk }

      # Signed release APK + AAB (Play Store). Requires the 4 repository secrets listed in README.md.
      - name: Check for signing secrets
        id: sign
        env: { KS: '${{ secrets.ANDROID_KEYSTORE_BASE64 }}' }
        run: echo "have=$([ -n "$KS" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      # Release builds (official or throwaway-key check) ship PRODUCTION ad settings: LevelPlay test mode OFF, so the
      # in-app test tools (Ad test suite, device ad id) are hidden and real ads are requested. The debug APK above keeps test mode ON.
      - name: Switch to production config (ads test mode OFF) for release builds
        run: |
          sed -i "s/testMode: true,/testMode: false,/" www/js/config.js
          grep -q "testMode: false," www/js/config.js || { echo "testMode was not switched off"; exit 1; }
          grep -n "testMode" www/js/config.js
          npx cap sync android

      - name: Build signed release APK + AAB
        if: steps.sign.outputs.have == 'true'
        working-directory: android
        env:
          VERSION_CODE: '${{ github.run_number }}'
          VERSION_NAME: '1.0.${{ github.run_number }}'
          ANDROID_KEYSTORE_PASSWORD: '${{ secrets.ANDROID_KEYSTORE_PASSWORD }}'
          ANDROID_KEY_ALIAS: '${{ secrets.ANDROID_KEY_ALIAS }}'
          ANDROID_KEY_PASSWORD: '${{ secrets.ANDROID_KEY_PASSWORD }}'
          KS_B64: '${{ secrets.ANDROID_KEYSTORE_BASE64 }}'
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/release.keystore"
          ./gradlew --no-daemon assembleRelease bundleRelease
      - if: steps.sign.outputs.have == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: PizzaStack-android-release
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab

      # No signing secrets yet? Prove the release pipeline (APK + AAB) still builds, using a THROWAWAY key.
      # These files are NOT official: they cannot be published or updated. Add the 4 secrets (README) for the real thing.
      - name: Release build check with a throwaway key (not for stores)
        if: steps.sign.outputs.have != 'true'
        working-directory: android
        env:
          VERSION_CODE: '${{ github.run_number }}'
          ANDROID_KEYSTORE_PASSWORD: throwaway
          ANDROID_KEY_ALIAS: throwaway
          ANDROID_KEY_PASSWORD: throwaway
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/throwaway.keystore" -alias throwaway -keyalg RSA -keysize 2048 -validity 30 \
            -storepass throwaway -keypass throwaway -dname "CN=Pizza Stack throwaway test key"
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/throwaway.keystore"
          ./gradlew --no-daemon assembleRelease bundleRelease
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/*.apk | head -5
          ls -la app/build/outputs/apk/release app/build/outputs/bundle/release
      - if: steps.sign.outputs.have != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: PizzaStack-android-release-THROWAWAY-KEY-NOT-FOR-STORES
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab

  ios:
    needs: test
    # Xcode 26 is what Apple requires for App Store uploads (and what Capacitor 8 needs); macos-26 ships it.
    runs-on: macos-26
    env:
      BUNDLE_ID: com.pizzatechnologies.pizzastack
      APP_VERSION: ${{ vars.IOS_VERSION || '1.0.0' }}     # repository variable IOS_VERSION overrides it (must go UP with each App Store release)
      BUILD_NUMBER: ${{ github.run_number }}              # must go up with every upload to App Store Connect
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Toolchain
        run: xcodebuild -version && xcode-select -p && pod --version
      - name: Sync web assets, plugins and CocoaPods
        run: npx cap sync ios
      - name: Resolved pod versions
        run: grep -E "^  - (Capacitor|IronSource|UnityAds)" ios/App/Podfile.lock || true

      # Always produce an installable-after-re-signing build: an UNSIGNED device IPA (ads test mode ON, like the debug APK).
      # It cannot be installed as is. Sideload it with Sideloadly / AltStore (free Apple ID, 7-day certificate) or sign it with your own certificate.
      - name: Build unsigned device IPA
        shell: bash
        run: |
          LOG="$RUNNER_TEMP/xcodebuild-unsigned.log"
          if command -v xcbeautify >/dev/null; then PRETTY=xcbeautify; else PRETTY=cat; fi
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/dd-unsigned" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION="$APP_VERSION" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            build 2>&1 | tee "$LOG" | $PRETTY
          APP="$RUNNER_TEMP/dd-unsigned/Build/Products/Release-iphoneos/App.app"
          test -d "$APP" || { echo "App.app was not produced"; exit 1; }
          mkdir -p "$RUNNER_TEMP/ipa/Payload" && cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$GITHUB_WORKSPACE/PizzaStack-ios-unsigned.ipa" Payload)
          ls -la PizzaStack-ios-unsigned.ipa
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" -c "Print :CFBundleShortVersionString" -c "Print :CFBundleVersion" -c "Print :MinimumOSVersion" "$APP/Info.plist"
      - name: Show build log on failure
        if: failure()
        run: tail -n 150 "$RUNNER_TEMP/xcodebuild-unsigned.log" || true
      - uses: actions/upload-artifact@v4
        with: { name: PizzaStack-ios-unsigned-ipa, path: PizzaStack-ios-unsigned.ipa }

      # Signed App Store build. Needs the repository secrets listed in README.md (iOS section); skipped until they exist.
      - name: Check for iOS signing secrets
        id: sign
        env:
          P12: ${{ secrets.IOS_CERT_P12_BASE64 }}
          PROFILE: ${{ secrets.IOS_PROFILE_BASE64 }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY: ${{ secrets.ASC_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          HAVE=$([ -n "$P12" ] && [ -n "$PROFILE" ] && [ -n "$TEAM" ] && echo true || echo false)
          UPLOAD=$([ -n "$ASC_KEY" ] && [ -n "$ASC_KEY_ID" ] && [ -n "$ASC_ISSUER_ID" ] && echo true || echo false)
          echo "have=$HAVE" >> "$GITHUB_OUTPUT"
          echo "upload=$UPLOAD" >> "$GITHUB_OUTPUT"
          if [ "$HAVE" != true ]; then echo "::notice title=iOS signing::No Apple signing secrets are set, so only the UNSIGNED test IPA was built. See the iOS section of README.md to get the App Store build."; fi
      # The release ships PRODUCTION ad settings (LevelPlay test mode OFF), exactly like the Android release.
      - name: Switch to production config (ads test mode OFF)
        if: steps.sign.outputs.have == 'true'
        run: |
          sed -i '' "s/testMode: true,/testMode: false,/" www/js/config.js
          grep -q "testMode: false," www/js/config.js || { echo "testMode was not switched off"; exit 1; }
          grep -n "testMode" www/js/config.js
          npx cap sync ios
      - name: Install certificate and provisioning profile
        if: steps.sign.outputs.have == 'true'
        shell: bash
        env:
          P12: ${{ secrets.IOS_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: |
          KC="$RUNNER_TEMP/build.keychain-db"; KCPASS="$(uuidgen)"
          echo "$P12" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KCPASS" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPASS" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$P12_PASSWORD" -A -t cert -f pkcs12
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCPASS" "$KC" > /dev/null
          security list-keychain -d user -s "$KC" login.keychain-db
          security find-identity -v -p codesigning "$KC"
          echo "$PROFILE" | base64 -d > "$RUNNER_TEMP/profile.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          PROFILE_UUID="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")"
          PROFILE_NAME="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "KEYCHAIN=$KC" >> "$GITHUB_ENV"
          echo "Profile: $PROFILE_NAME ($PROFILE_UUID)"
      # Archive unsigned, then sign while exporting (keeps the CocoaPods targets out of the signing step).
      - name: Archive and export signed IPA
        if: steps.sign.outputs.have == 'true'
        shell: bash
        env: { TEAM: '${{ secrets.APPLE_TEAM_ID }}' }
        run: |
          LOG="$RUNNER_TEMP/xcodebuild-archive.log"
          if command -v xcbeautify >/dev/null; then PRETTY=xcbeautify; else PRETTY=cat; fi
          xcodebuild archive -workspace ios/App/App.xcworkspace -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION="$APP_VERSION" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" 2>&1 | tee "$LOG" | $PRETTY
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key><dict><key>$BUNDLE_ID</key><string>$PROFILE_NAME</string></dict>
            <key>uploadSymbols</key><true/>
            <key>stripSwiftSymbols</key><true/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" 2>&1 | tee -a "$LOG" | $PRETTY
          ls -la "$RUNNER_TEMP/export"
          cp "$RUNNER_TEMP/export/"*.ipa "$GITHUB_WORKSPACE/PizzaStack-ios-appstore.ipa"
      - name: Show signing log on failure
        if: failure() && steps.sign.outputs.have == 'true'
        run: tail -n 150 "$RUNNER_TEMP/xcodebuild-archive.log" || true
      - if: steps.sign.outputs.have == 'true'
        uses: actions/upload-artifact@v4
        with: { name: PizzaStack-ios-appstore-ipa, path: PizzaStack-ios-appstore.ipa }
      # Optional: send the IPA straight to App Store Connect / TestFlight (needs the 3 ASC_* secrets). Without them, upload the IPA with Apple's Transporter app.
      # Runs only for main, release tags and manual runs, so ordinary branch pushes do not each create a TestFlight build.
      - name: Upload to App Store Connect (TestFlight)
        if: steps.sign.outputs.have == 'true' && steps.sign.outputs.upload == 'true' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
        shell: bash
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          mkdir -p "$HOME/.private_keys"
          echo "$ASC_KEY" | base64 -d > "$HOME/.private_keys/AuthKey_${ASC_KEY_ID}.p8"
          # altool can print an error and still exit 0 on newer Xcode, so read its output instead of trusting the exit status alone
          set +e
          xcrun altool --upload-app --type ios --file PizzaStack-ios-appstore.ipa --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" 2>&1 | tee "$RUNNER_TEMP/altool.log"
          RC=${PIPESTATUS[0]}
          set -e
          if [ "$RC" != 0 ] || grep -Eiq 'UPLOAD FAILED|\*\*\* Error|ERROR ITMS|error:' "$RUNNER_TEMP/altool.log"; then echo "::error::The upload to App Store Connect failed - see the log above."; exit 1; fi
          grep -q "No errors uploading" "$RUNNER_TEMP/altool.log" || echo "::warning::Could not confirm the upload from altool's output. Check App Store Connect > TestFlight before assuming it arrived."
      - name: Remove signing material from the runner
        if: always() && steps.sign.outputs.have == 'true'
        run: |
          [ -n "$KEYCHAIN" ] && security delete-keychain "$KEYCHAIN" || true
          rm -rf "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/.private_keys" "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/profile.mobileprovision" || true

  desktop:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, script: 'dist:win',   name: windows }
          - { os: ubuntu-latest,  script: 'dist:linux', name: linux }
          - { os: macos-latest,   script: 'dist:mac',   name: macos }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'   # unsigned unless you add code-signing certs (see README)
      - uses: actions/upload-artifact@v4
        with:
          name: PizzaStack-${{ matrix.name }}
          path: |
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/*.dmg

  release:
    # iOS is listed in needs so its artifacts are available, but an iOS failure must not block the Android + desktop release
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') && needs.android.result == 'success' && needs.desktop.result == 'success' }}
    needs: [android, ios, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
